name: Build AuditScope

on:
  push:
    branches: [main]
    paths:
      - "tools/auditscope/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node tools/auditscope/scripts/build.mjs

      - name: Commit rebuilt AuditScope assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/auditscope/
          if git diff-index --quiet HEAD; then
            echo "No AuditScope build changes to commit."
          else
            git commit -m "build(auditscope): rebuild issues + feed.xml"
            git push origin HEAD:main
          fi
