<body class="bg-white text-slate-900 min-h-screen flex flex-col items-center justify-center p-5">
    <div class="max-w-xl w-full bg-white border border-slate-200 rounded-3xl shadow-xl p-8 md:p-12 space-y-8">

        <!-- Warning Icon -->
        <div class="text-center">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-amber-100 scale-in">
                <i class="fa-solid fa-triangle-exclamation text-amber-500 text-3xl"></i>
            </div>
        </div>

        <div class="text-center space-y-3">
            <h1 class="text-2xl md:text-3xl font-bold text-slate-900">決済がキャンセルされました</h1>
            <p class="text-slate-500 leading-relaxed">
                決済手続きがキャンセルされました。<br>
                ご不明な点やお困りのことがございましたら、お気軽にお問い合わせください。
            </p>
        </div>

        <!-- Info Box -->
        <div class="bg-amber-50 border border-amber-200 rounded-xl p-5 space-y-3">
            <h2 class="text-base font-bold text-amber-800 flex items-center gap-2">
                <i class="fa-solid fa-lightbulb"></i>
                ご確認ください
            </h2>
            <p class="text-amber-700 text-sm leading-relaxed">
                決済を完了するには、カード情報を入力して「Subscribe」ボタンをクリックしてください。
                セキュリティ上の理由でキャンセルされた場合は、別のカードをお試しいただくか、
                カード会社にお問い合わせください。
            </p>
        </div>

        <!-- Buttons -->
        <div class="flex flex-col md:flex-row gap-4">
            <a href="services.html" class="flex-1 inline-flex items-center justify-center gap-2 px-6 py-4 rounded-full bg-brand-flame text-white font-bold hover:bg-brand-flame/90 transition shadow-lg shadow-brand-flame/20">
                <i class="fa-solid fa-rotate-right"></i>
                もう一度試す
            </a>
            <a href="index.html" class="flex-1 inline-flex items-center justify-center gap-2 px-6 py-4 rounded-full border-2 border-slate-300 text-slate-700 font-bold hover:border-slate-400 hover:bg-slate-50 transition">
                <i class="fa-solid fa-home"></i>
                ホームに戻る
            </a>
        </div>

        <!-- Footer Note -->
        <p class="text-center text-slate-400 text-xs leading-relaxed">
            ご質問やサポートが必要な場合は、お気軽にお問い合わせください。<br>
            Library Memberの詳細については、サービスページをご覧ください。
        </p>
    </div>
