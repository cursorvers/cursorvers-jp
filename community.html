<!DOCTYPE html>
<html lang="ja" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-TX3Y6G4XWJ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-TX3Y6G4XWJ');
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="canonical" href="https://cursorvers.jp/community">
  <meta property="og:url" content="https://cursorvers.jp/community">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:site_name" content="Cursorvers.edu">
  <title>Cursorvers Community Join</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans JP"', 'sans-serif'],
            en: ['"Manrope"', 'sans-serif'],
          },
          colors: {
            'brand-bg': '#FFFFFF',
            'brand-surface': '#F8FAFC',
            'brand-flame': '#FF4500',
            'brand-gold': '#FF5A1F',
            'brand-slate': '#475569',
            'brand-text-main': '#0F172A',
            'brand-border': '#E2E8F0',
          },
        },
      },
    };
  </script>
  <style>
    body {
      font-family: "Noto Sans JP", system-ui, sans-serif;
      background-color: #FFFFFF;
      color: #0F172A;
    }
    .step.active {
      background: #FF4500;
    }
  </style>
</head>
<body class="bg-white text-slate-900 min-h-screen flex items-center justify-center p-5">
  <div class="max-w-lg w-full bg-white border border-slate-200 rounded-2xl shadow-xl p-8 md:p-10 space-y-6">
    <div class="text-xs uppercase tracking-[0.4em] text-brand-flame font-bold font-en">FREE COMMUNITY</div>
    <h1 class="text-2xl md:text-3xl font-bold text-slate-900">参加フォーム</h1>

    <!-- ステップインジケーター -->
    <div class="flex gap-2">
      <div class="step flex-1 h-1 rounded-full bg-brand-flame" id="step1"></div>
      <div class="step flex-1 h-1 rounded-full bg-slate-200" id="step2"></div>
    </div>

    <div class="text-slate-600 text-sm leading-relaxed space-y-2">
      <p>LINEで友だち追加し、最新のSafety & Literacyアップデートを受け取ります。</p>
      <p class="text-slate-900 font-semibold">メール登録で「Safetyスタートパック」（最新AI副業トレンド＋安全プロンプトLite）を配布。</p>
      <p class="text-slate-500 text-xs">メールは任意です。</p>
    </div>

    <div class="bg-brand-flame/10 border border-brand-flame/30 rounded-xl p-4 text-brand-flame text-sm font-medium">
      <i class="fa-solid fa-triangle-exclamation mr-2"></i>PHI（診療情報）は絶対に入力しないでください。
    </div>

    <div id="status" class="text-sm font-semibold hidden"></div>

    <!-- ステップ1: メール登録フォーム -->
    <div id="email-form-section" class="space-y-5">
      <label class="flex items-center gap-3 text-sm text-slate-700 bg-slate-50 border border-slate-200 rounded-xl p-4 cursor-pointer hover:bg-slate-100 transition">
        <input type="checkbox" id="email-opt-in" checked class="rounded border-slate-300 text-brand-flame focus:ring-brand-flame">
        <span>メールアドレスを登録して特典を受け取る</span>
      </label>

      <div id="email-input-section" class="space-y-4">
        <div class="space-y-2">
          <label for="email" class="text-sm font-semibold text-slate-900">メールアドレス</label>
          <input type="email" id="email" name="email" placeholder="your-email@example.com" class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-flame focus:border-brand-flame">
          <p class="text-xs text-slate-500">メール登録で特典配布。未入力でもLINE登録できます。</p>
        </div>

        <label class="flex items-start gap-3 text-sm text-slate-600">
          <input type="checkbox" id="opt-in" checked class="mt-1 rounded border-slate-300 text-brand-flame focus:ring-brand-flame">
          <span>ニュースレター／アップデートをメールで受け取る（任意、初期ON）</span>
        </label>
      </div>

      <label class="flex items-start gap-3 text-sm text-slate-600">
        <input type="checkbox" id="agree" required class="mt-1 rounded border-slate-300 text-brand-flame focus:ring-brand-flame">
        <span><a href="terms.html" class="underline hover:text-brand-flame">利用規約</a>・<a href="privacy.html" class="underline hover:text-brand-flame">プライバシーポリシー</a>・PHI禁止に同意する</span>
      </label>

      <button id="email-submit-btn" class="w-full rounded-full bg-brand-flame text-white font-bold py-3 hover:bg-brand-flame/90 transition focus:outline-none focus:ring-2 focus:ring-brand-flame focus:ring-offset-2">
        次へ（LINE登録）
      </button>
    </div>

    <!-- ステップ2: LINEログインセクション -->
    <div id="line-login-section" class="space-y-5 hidden">
      <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 text-slate-700 text-sm leading-relaxed" id="line-login-message"></div>
      <button id="line-login-btn" class="w-full rounded-full bg-[#06C755] text-white font-bold py-3 hover:opacity-90 transition focus:outline-none focus:ring-2 focus:ring-[#06C755] focus:ring-offset-2 flex items-center justify-center gap-2">
        <i class="fa-brands fa-line text-xl"></i>
        LINEでログイン
      </button>
    </div>

    <!-- 完了メッセージ -->
    <div id="complete-section" class="hidden space-y-4">
      <div class="bg-green-50 border border-green-200 rounded-xl p-4 text-green-700 text-sm font-medium flex items-center gap-2">
        <i class="fa-solid fa-circle-check"></i>
        登録が完了しました！
      </div>
      <div id="line-user" class="bg-slate-50 border border-slate-200 rounded-xl p-4 text-slate-500 text-xs"></div>
    </div>

    <div class="pt-4 border-t border-slate-200 text-center">
      <a href="index.html" class="text-sm text-slate-500 hover:text-brand-flame transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-arrow-left text-xs"></i>
        トップページに戻る
      </a>
    </div>
  </div>

  <script>
    const LIFF_FALLBACK_ID = "2008640048-jnoneGgO";
    const API_ENDPOINT = "https://haaxgwyimoqzzxzdaeep.functions.supabase.co/line-register";

    const statusEl = document.getElementById("status");
    const emailOptIn = document.getElementById("email-opt-in");
    const emailInputSection = document.getElementById("email-input-section");
    const emailFormSection = document.getElementById("email-form-section");
    const emailSubmitBtn = document.getElementById("email-submit-btn");
    const lineLoginSection = document.getElementById("line-login-section");
    const lineLoginBtn = document.getElementById("line-login-btn");
    const lineLoginMessage = document.getElementById("line-login-message");
    const completeSection = document.getElementById("complete-section");
    const userEl = document.getElementById("line-user");
    const step1 = document.getElementById("step1");
    const step2 = document.getElementById("step2");

    let savedEmail = null;
    let savedOptIn = false;
    let lineUserId = null;
    let liffId = LIFF_FALLBACK_ID;
    let liffLoaded = false;

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.className = `text-sm font-semibold p-3 rounded-xl ${isError ? 'bg-red-50 border border-red-200 text-red-600' : 'bg-green-50 border border-green-200 text-green-600'}`;
      statusEl.classList.remove('hidden');
    }

    function goToStep2() {
      step1.classList.remove('bg-brand-flame');
      step1.classList.add('bg-slate-300');
      step2.classList.remove('bg-slate-200');
      step2.classList.add('bg-brand-flame');
      emailFormSection.classList.add('hidden');
      lineLoginSection.classList.remove('hidden');
      statusEl.classList.add('hidden');
    }

    emailOptIn.addEventListener('change', () => {
      if (emailOptIn.checked) {
        emailInputSection.classList.remove('hidden');
      } else {
        emailInputSection.classList.add('hidden');
      }
    });

    emailSubmitBtn.addEventListener('click', async () => {
      const agreeCheckbox = document.getElementById('agree');
      if (!agreeCheckbox.checked) {
        setStatus('利用規約に同意してください', true);
        return;
      }

      emailSubmitBtn.disabled = true;
      emailSubmitBtn.textContent = '処理中...';

      try {
        let message = '';

        if (emailOptIn.checked) {
          const email = document.getElementById('email').value.trim();
          if (email) {
            const optIn = document.getElementById('opt-in').checked;

            const response = await fetch(API_ENDPOINT, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                email: email,
                opt_in_email: optIn
              })
            });

            if (!response.ok) {
              throw new Error('メール登録に失敗しました');
            }

            sessionStorage.setItem('savedEmail', email);
            sessionStorage.setItem('savedOptIn', optIn.toString());
            savedEmail = email;
            savedOptIn = optIn;

            message = '✅ メール登録が完了しました！\n\n次に、LINEアカウントと連携して登録を完了してください。';
          } else {
            message = 'LINEアカウントで登録を完了してください。';
          }
        } else {
          message = 'LINEアカウントで登録を完了してください。';
        }

        lineLoginMessage.textContent = message;
        goToStep2();

      } catch (error) {
        console.error('Error:', error);
        setStatus(error.message || 'エラーが発生しました', true);
      } finally {
        emailSubmitBtn.disabled = false;
        emailSubmitBtn.textContent = '次へ（LINE登録）';
      }
    });

    function loadLiffSdk() {
      return new Promise((resolve, reject) => {
        if (liffLoaded) {
          resolve();
          return;
        }

        const script = document.createElement('script');
        script.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js';
        script.onload = () => {
          liffLoaded = true;
          resolve();
        };
        script.onerror = reject;
        document.head.appendChild(script);
      });
    }

    lineLoginBtn.addEventListener('click', async () => {
      lineLoginBtn.disabled = true;
      lineLoginMessage.textContent = 'LINEログイン準備中...';

      try {
        await loadLiffSdk();

        lineLoginMessage.textContent = 'LINEログイン中...';

        const params = new URLSearchParams(window.location.search);
        if (params.has('liffId')) {
          liffId = params.get('liffId');
        }

        await liff.init({ liffId: liffId });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        await linkLineAccount();

      } catch (error) {
        console.error('LIFF Error:', error);
        lineLoginMessage.textContent = '❌ LINEログインに失敗しました。もう一度お試しください。';
      } finally {
        lineLoginBtn.disabled = false;
      }
    });

    async function linkLineAccount() {
      try {
        const profile = await liff.getProfile();
        lineUserId = profile.userId;

        const storedEmail = sessionStorage.getItem('savedEmail');
        const storedOptIn = sessionStorage.getItem('savedOptIn') === 'true';

        const payload = {
          line_user_id: lineUserId,
          opt_in_email: storedOptIn
        };

        if (storedEmail) {
          payload.email = storedEmail;
        }

        const response = await fetch(API_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          throw new Error('LINE連携に失敗しました');
        }

        sessionStorage.removeItem('savedEmail');
        sessionStorage.removeItem('savedOptIn');

        lineLoginSection.classList.add('hidden');
        completeSection.classList.remove('hidden');
        userEl.textContent = `LINE User ID: ${lineUserId.substring(0, 8)}...`;

      } catch (error) {
        console.error('Link Error:', error);
        lineLoginMessage.textContent = `❌ ${error.message || 'LINE連携に失敗しました'}`;
      }
    }
  </script>
</body>
</html>
